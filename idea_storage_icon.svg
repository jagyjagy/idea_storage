<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#2C2B28"/>
      <stop offset="100%" stop-color="#1C1B18"/>
    </linearGradient>

    <!-- Subtle surface sheen top edge -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.09)"/>
      <stop offset="8%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- Text gradient — pale ghost white -->
    <linearGradient id="tg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.58)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.32)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.18)"/>
    </linearGradient>

    <!-- Drop shadow for emboss feel -->
    <filter id="emboss" x="-5%" y="-5%" width="110%" height="120%">
      <!-- dark shadow below letters -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset dx="0" dy="10" in="blur" result="shadow"/>
      <feFlood flood-color="rgba(0,0,0,0.8)" result="black"/>
      <feComposite in="black" in2="shadow" operator="in" result="darkShadow"/>
      <!-- highlight above letters -->
      <feOffset dx="0" dy="-6" in="blur" result="hiOff"/>
      <feFlood flood-color="rgba(255,255,255,0.12)" result="white"/>
      <feComposite in="white" in2="hiOff" operator="in" result="highlight"/>
      <feMerge>
        <feMergeNode in="darkShadow"/>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="highlight"/>
      </feMerge>
    </filter>

    <!-- Clip to rounded rect -->
    <clipPath id="roundedRect">
      <rect width="1024" height="1024" rx="230" ry="230"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="230" ry="230" fill="url(#bg)"/>

  <!-- Surface sheen -->
  <rect width="1024" height="1024" rx="230" ry="230" fill="url(#sheen)"/>

  <!-- The word "idea" — Italic serif, ghost embossed -->
  <text
    x="512"
    y="620"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-weight="300"
    font-size="420"
    letter-spacing="-8"
    fill="url(#tg)"
    filter="url(#emboss)"
    clip-path="url(#roundedRect)"
  >idea</text>

  <!-- Inner border glow — very subtle -->
  <rect width="1024" height="1024" rx="230" ry="230"
    fill="none"
    stroke="rgba(255,255,255,0.06)"
    stroke-width="2"/>
</svg>
